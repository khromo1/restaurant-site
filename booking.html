<!DOCTYPE html>
<html lang="ru">

<head>
    <link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Book a table</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <!--Автор страницы - Глеб-->
</head>
    
<body>
    <header id="main-header">
        <img src="images/logo.png" class="logo">
    </header>

    <nav class="navbar navbar-expand-lg custom-background" id="nav">
        <div class="container">
            <a class="navbar-brand text-white" href="index.html">
                Клод<span id="diff-color-cpan">Моне</span>
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link text-white" href="index.html">
                        Главная
                    </a>
                    <a class="nav-link text-white" href="menu.html">
                        Меню
                    </a>
                    <a class="nav-link text-white" href="booking.html">
                        Забронировать
                    </a>
                    <a class="nav-link text-white" href="about.html">
                        О нас
                    </a>
                    <a class="nav-link text-white" href="join.html">
                        Вакансии
                    </a>
                </div>
            </div>
         </div>
    </nav>

    <form class="mx-auto p-4 mt-4 mb-4 border rounded" style="max-width: 44rem;">
        <h2 class="text-center">Бронирование столика</h2>
        <div class="row">

            <div class="col-12 col-md-6 mb-3">
                <label for="name" class="form-label">Имя</label>
                <input type="text" id="name" class="form-control">
            </div>

            <div class="col-12 col-md-6 mb-3">
                <label for="email" class="form-label">Электронная почта</label>
                <input type="email" id="email" class="form-control">
            </div>

            <div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Телефон</label>
                    <div class="input-group">
                        <span class="input-group-text">+7</span>
                        <input type="tel" id="phone" class="form-control" placeholder="___________">
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 mb-3">
                <label for="date" class="form-label">Дата бронирования</label>
                <input type="date" id="date" class="form-control">
            </div>

            <div class="col-12 col-md-6 mb-3">
                <label for="time" class="form-label">Время бронирования</label>
                <input type="time" id="time" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Способ связи</label>

                <div class="form-check">
                    <input class="form-check-input" type="radio" name="contact" id="contactPhone">
                    <label class="form-check-label" for="contactPhone">
                        Телефон
                    </label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="radio" name="contact" id="contactEmail">
                    <label class="form-check-label" for="contactEmail">
                        Email
                    </label>
                </div>
            </div>

            <div class="mb-3">
                <label for="table" class="form-label">Выберите столик</label>

                <select id="table" class="form-select">
                    <option selected>Выберите столик</option>
                    <option>Столик №1</option>
                    <option>Столик №2</option>
                    <option>Столик №3</option>
                    <option>Столик №4</option>
                    <option>Столик №5</option>
                    <option>Столик №6</option>
                    <option>Столик №7</option>
                    <option>Столик №8</option>
                    <option>Столик №9</option>
                </select>
            </div>

            <div class="btn-group">
                <button type="reset" class="btn btn-outline-danger">Очистить</button>
                <button type="submit" class="btn btn-outline-success">Забронировать</button>
                <button type="button" class="btn btn-outline-dark"
                        onclick="window.location.href='index.html'">Назад</button>
            </div>
        </div>
    
    </form>

    <footer>
        <p>Разработчики: Глеб Минор, Темирлан Тыныбеков</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
