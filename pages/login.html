<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>Вход — Клод Моне</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/theme.css">
        <link rel="stylesheet" href="css/components.css">
    </head>
    
    <body>
        <header class="site-header">
            <a class="brand" href="index.html">Клод Моне</a>
            <nav aria-label="Основная навигация">
                <a href="index.html">Главная</a>
                <a href="menu.html">Меню</a>
                <a href="about.html">О нас</a>
                <a href="booking.html">Бронирование</a>
                <a href="profile.html" id="profile-nav-link">Профиль</a>
            </nav>
            <button id="theme-toggle" class="theme-btn" type="button" aria-label="Переключить тему">◐</button>
        </header>

        <main class="auth-main container">
            <section class="auth-card">
                <p class="eyebrow">С возвращением</p>
                <h1>Войти в аккаунт</h1>

                <form id="login-form" novalidate>
                    <label for="login-email">Email</label>
                    <input id="login-email" name="email" type="text" inputmode="email" autocomplete="email">
                    <small class="field-error" id="login-email-error"></small>

                    <label for="login-password">Пароль</label>
                    <input id="login-password" name="password" type="password" autocomplete="current-password">
                    <small class="field-error" id="login-password-error"></small>

                    <p class="form-message" id="login-message" role="status"></p>
                    <button class="btn" type="submit">Войти</button>
                </form>

                <p>Нет аккаунта? <a href="signup.html">Зарегистрироваться</a></p>
            </section>
        </main>
        
        <footer class="site-footer"><p>© Клод Моне. Учебный проект.</p></footer>

        <script src="js/theme.js" defer></script>
        <script src="js/main.js" defer></script>
        <script src="js/auth.js" defer></script>
        <script src="js/auth-nav.js" defer></script>
    </body>
</html>
