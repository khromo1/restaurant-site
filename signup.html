<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>Регистрация — Клод Моне</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/theme.css">
        <link rel="stylesheet" href="css/components.css">
    </head>
    
    <body>
        <header class="site-header">
            <a class="brand" href="index.html">Клод Моне</a>
            <nav aria-label="Основная навигация">
                <a href="index.html">Главная</a>
                <a href="menu.html">Меню</a>
                <a href="about.html">О нас</a>
                <a href="booking.html">Бронирование</a>
                <a href="profile.html" id="profile-nav-link">Профиль</a>
            </nav>
            <button id="theme-toggle" class="theme-btn" type="button" aria-label="Переключить тему">◐</button>
        
        </header>

        <main class="auth-main container">
            <section class="auth-card">
                <p class="eyebrow">Добро пожаловать</p>
                <h1>Создать аккаунт</h1>

                <form id="signup-form" novalidate>
                    <label for="signup-name">Имя</label>
                    <input id="signup-name" name="name" type="text" autocomplete="name">
                    <small class="field-error" id="signup-name-error"></small>

                    <label for="signup-email">Email</label>
                    <input id="signup-email" name="email" type="text" inputmode="email" autocomplete="email">
                    <small class="field-error" id="signup-email-error"></small>

                    <label for="signup-password">Пароль</label>
                    <input id="signup-password" name="password" type="password" autocomplete="new-password">
                    <small class="field-error" id="signup-password-error"></small>

                    <label for="signup-confirm">Повторите пароль</label>
                    <input id="signup-confirm" name="confirm" type="password" autocomplete="new-password">
                    <small class="field-error" id="signup-confirm-error"></small>

                    <p class="form-message" id="signup-message" role="status"></p>
                    <button class="btn" type="submit">Зарегистрироваться</button>

                </form>
                
                <p>Уже есть аккаунт? <a href="login.html">Войти</a></p>
            
            </section>
        </main>
        
        <footer class="site-footer">
            <p>© Клод Моне. Учебный проект.</p>
        </footer>

        <script src="js/theme.js" defer></script>
        <script src="js/main.js" defer></script>
        <script src="js/auth.js" defer></script>
        <script src="js/auth-nav.js" defer></script>
    </body>
</html>
